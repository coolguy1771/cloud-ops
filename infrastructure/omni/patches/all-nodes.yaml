# Applied to every node in the cluster via Omni config patches (Terraform).
#
# Enables the external cloud provider so hcloud-ccm and talos-ccm can manage
# node lifecycle, load balancers, and routes. Without this flag Kubernetes
# marks nodes with the legacy cloud-controller taint and they stay unschedulable.
cluster:
  externalCloudProvider:
    enabled: true

  # Tell Talos not to deploy a CNI — Cilium is deployed by Flux instead.
  network:
    cni:
      name: none

  # Disable kube-proxy; Cilium provides full kube-proxy replacement (KPR).
  proxy:
    disabled: true

machine:
  kubelet:
    extraArgs:
      rotate-server-certificates: true
    # Without this, kubelet auto-picks its node IP based on interface/route
    # timing at boot, which is non-deterministic — some nodes have landed on
    # their public IP instead of the private network (10.0.1.0/24, part of
    # network_ip_range 10.0.0.0/8), breaking cross-node pod traffic to them.
    nodeIP:
      validSubnets:
        - 10.0.0.0/8

  # KubePrism proxies the API server locally for node components (Cilium, etc.).
  features:
    kubePrism:
      enabled: true
      port: 7445

    # Required when Cilium socketLB is enabled with hostNamespaceOnly.
    hostDNS:
      enabled: true
      forwardKubeDNSToHost: true
