---
# yaml-language-server: $schema=https://json.schemastore.org/helmfile

# Extract CRDs from upstream charts and apply with kubectl. Do not helmfile sync
# these releases — only render CRDs (--include-crds) and pipe to the cluster.

helmDefaults:
  args:
    - --include-crds
    - --no-hooks

bases:
  - crds-default.yaml

defaultInherit: crds

releases:
  - name: talos-ccm
    namespace: kube-system

  - name: external-dns
    namespace: network

  - name: external-secrets
    namespace: external-secrets

  - name: grafana
    namespace: observability

  - name: prometheus-operator-crds
    namespace: observability
    chart: oci://ghcr.io/prometheus-community/charts/prometheus-operator-crds
    version: "31.0.1"

  # Standard gateway.networking.k8s.io CRDs (Gateway, HTTPRoute, GatewayClass,
  # ReferenceGrant), needed by Istio Gateway/HTTPRoute/waypoint resources and by
  # every app's httproute.yaml. Previously came along for free via the envoy-gateway
  # release below, which bundled them; removing that release without replacing this
  # dropped the only CRD source, so a fresh bootstrap would fail with unknown-kind
  # errors on Gateway/HTTPRoute. This chart installs *only* CRDs (no app) — safe to
  # keep even without Envoy Gateway installed.
  - name: gateway-api-crds
    namespace: istio-system
    chart: oci://docker.io/envoyproxy/gateway-crds-helm
    version: "v1.9.0"
    values:
      - crds:
          gatewayAPI:
            enabled: true
            channel: standard
          envoyGateway:
            enabled: false
