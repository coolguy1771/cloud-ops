---
name: Terraform

on:
  pull_request:
    branches: [main]
    paths:
      - infrastructure/terraform/**
      - .github/workflows/terraform.yaml
      - .tflint.hcl

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Terraform - Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0

      - name: Check formatting
        run: terraform fmt -check -recursive
        working-directory: infrastructure/terraform

      - name: Initialize Terraform
        run: terraform init -backend=false -input=false
        working-directory: infrastructure/terraform

      - name: Validate Terraform
        run: terraform validate
        working-directory: infrastructure/terraform

      - name: Initialize TFLint
        run: tflint --config="$GITHUB_WORKSPACE/.tflint.hcl" --init
        working-directory: infrastructure/terraform

      - name: Run TFLint
        run: tflint --config="$GITHUB_WORKSPACE/.tflint.hcl" --recursive
        working-directory: infrastructure/terraform

      - name: Scan Terraform configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: infrastructure/terraform
          exit-code: "1"
          severity: HIGH,CRITICAL
