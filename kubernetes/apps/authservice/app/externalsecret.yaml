---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# 1Password item "hubble-oauth" in vault cloud-ops: client_id, client_secret.
# Authentik: OAuth2/OIDC provider + app "hubble", redirect
#   https://hubble.cloud.witl.xyz/callback
# Policy binding: only group cloud-ops-admin. Include groups in the ID token.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authservice-oidc
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: authservice-oidc
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        client-secret: "{{ .client_secret }}"
        config.json: |
          {
            "listen_address": "0.0.0.0",
            "listen_port": "10003",
            "log_level": "info",
            "allow_unmatched_requests": false,
            "chains": [
              {
                "name": "hubble-oidc",
                "filters": [
                  {
                    "oidc": {
                      "configuration_uri": "https://auth.cloud.witl.xyz/application/o/hubble/.well-known/openid-configuration",
                      "callback_uri": "https://hubble.cloud.witl.xyz/callback",
                      "client_id": "{{ .client_id }}",
                      "client_secret_ref": {
                        "namespace": "authservice",
                        "name": "authservice-oidc"
                      },
                      "scopes": ["profile", "email", "groups"],
                      "cookie_name_prefix": "hubble",
                      "id_token": {
                        "preamble": "Bearer",
                        "header": "authorization"
                      },
                      "access_token": {
                        "header": "x-access-token"
                      },
                      "logout": {
                        "path": "/authservice_logout",
                        "redirect_uri": "https://hubble.cloud.witl.xyz/"
                      }
                    }
                  }
                ]
              }
            ]
          }
  dataFrom:
    - extract:
        key: hubble-oauth
