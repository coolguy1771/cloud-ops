---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: istio
spec:
  dependsOn:
    - name: cilium
      namespace: kube-system
    - name: grafana
      namespace: observability
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: ztunnel
      namespace: istio-system
  interval: 1h
  path: ./kubernetes/apps/istio-system/istio/app
  postBuild:
    substituteFrom:
      - kind: Secret
        name: grafana-datasource-org
        namespace: observability
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: istio-system
  wait: true
