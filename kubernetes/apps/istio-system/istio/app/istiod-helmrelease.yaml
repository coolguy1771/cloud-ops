---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istiod
spec:
  dependsOn:
    - name: istio-base
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: istiod
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    profile: ambient
    pilot:
      env:
        PILOT_ENABLE_AMBIENT_CONTROLLERS: "true"
