---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istiod
spec:
  dependsOn:
    - name: istio-base
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: istiod
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    profile: ambient
    # Autoscaling via KEDA (istiod-scaledobject.yaml); replicaCount stays unset so
    # the chart omits spec.replicas and KEDA's HPA owns it.
    autoscaleEnabled: false
    rollingMaxUnavailable: 1
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: 2000m
        memory: 2Gi
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
                - key: app
                  operator: In
                  values:
                    - istiod
            topologyKey: kubernetes.io/hostname
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - istiod
              topologyKey: topology.kubernetes.io/zone
    meshConfig:
      pathNormalization:
        normalization: DECODE_AND_MERGE_SLASHES
      extensionProviders:
        # Route mesh traces through Alloy so service-graph metrics can be derived,
        # then forwarded to Tempo (see k8s-monitoring destinations.tempo).
        - name: tempo
          opentelemetry:
            service: k8s-monitoring-alloy-receiver.observability.svc.cluster.local
            port: 4318
            http:
              path: /v1/traces
              timeout: 10s
              headers:
                - name: X-Scope-OrgID
                  value: "${ORG_ID}"
        - name: authservice-grpc
          envoyExtAuthzGrpc:
            service: authservice.authservice.svc.cluster.local
            port: "10003"
    pilot:
      env:
        PILOT_ENABLE_AMBIENT_CONTROLLERS: "true"
