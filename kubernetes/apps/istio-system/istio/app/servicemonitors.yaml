---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: ztunnel
  namespace: istio-system
spec:
  selector:
    matchLabels:
      app: ztunnel
  namespaceSelector:
    matchNames:
      - istio-system
  podMetricsEndpoints:
    - port: ztunnel-stats
      path: /metrics
      interval: 30s
---
# L7 Istio metrics from ambient waypoints (prometheus.io annotations alone are not scraped).
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: istio-waypoint
  namespace: istio-system
spec:
  selector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: waypoint
  namespaceSelector:
    any: true
  podMetricsEndpoints:
    # Istio agent /stats/prometheus already merges agent + Envoy; do not also
    # scrape http-envoy-prom or Envoy series are duplicated.
    - port: metrics
      path: /stats/prometheus
      interval: 30s
