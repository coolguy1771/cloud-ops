---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Copy Authentik-generated client_id + client_secret into 1Password item kiali-oauth.
# Split targets: Flux substituteFrom must not see client_secret (envsubst $/$$ pitfalls).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kiali-oauth
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kiali
    template:
      engineVersion: v2
      data:
        oidc-secret: "{{ .client_secret }}"
  dataFrom:
    - extract:
        key: kiali-oauth
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kiali-oauth-client-id
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kiali-oauth-client-id
    template:
      engineVersion: v2
      data:
        client_id: "{{ .client_id }}"
  dataFrom:
    - extract:
        key: kiali-oauth
---
# Mimir multitenancy: same org-id as Grafana datasources (Duo M2M client UUID).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kiali-mimir-org
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kiali-mimir-org
  data:
    - secretKey: mimir_org_id
      remoteRef:
        key: grafana-datasource-org
        property: org-id
---
# Grafana admin password for Kiali dashboard discovery (viewer-level API access).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kiali-grafana
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kiali-grafana
    template:
      engineVersion: v2
      data:
        password: "{{ .GF_SECURITY_ADMIN_PASSWORD }}"
  dataFrom:
    - extract:
        key: grafana
