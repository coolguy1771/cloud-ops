---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kiali-operator
spec:
  interval: 1h
  chart:
    spec:
      chart: kiali-operator
      version: "2.31.0"
      sourceRef:
        kind: HelmRepository
        name: kiali
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    cr:
      create: false
    watchNamespace: ""
    clusterRoleCreator: true
    allowAllAccessibleNamespaces: true
