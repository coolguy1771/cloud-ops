---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vpa
spec:
  chart:
    spec:
      chart: vpa
      version: 5.0.1
      sourceRef:
        kind: HelmRepository
        name: fairwinds
  interval: 1h
  values:
    admissionController:
      enabled: false
    updater:
      enabled: false
    recommender:
      enabled: true
      replicaCount: 1
      podMonitor:
        enabled: true
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 1Gi
