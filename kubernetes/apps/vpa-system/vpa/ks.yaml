---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vpa
spec:
  dependsOn:
    - name: metrics-server
      namespace: kube-system
  interval: 1h
  path: ./kubernetes/apps/vpa-system/vpa/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: vpa-system
  wait: true
