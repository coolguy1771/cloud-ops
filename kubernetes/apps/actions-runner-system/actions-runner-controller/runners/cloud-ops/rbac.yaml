---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloud-ops-runner
---
# Least privilege for ARC kubernetes container mode (container hooks), mirroring the
# chart's own *-gha-rs-kube-mode Role. The chart only creates that Role when it also
# owns the ServiceAccount, so it's declared here for our named SA. Previously
# cluster-admin: any workflow on this runner could take over the cluster.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cloud-ops-runner
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["get", "create"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cloud-ops-runner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cloud-ops-runner
subjects:
  - kind: ServiceAccount
    name: cloud-ops-runner
    namespace: actions-runner-system
