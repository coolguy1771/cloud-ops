---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: onepassword-connect
spec:
  chartRef:
    kind: OCIRepository
    name: onepassword-connect
  interval: 1h
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  # Chart always renders spec.replicas; strip it so KEDA's HPA owns replica count.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: onepassword-connect
            patch: |
              - op: remove
                path: /spec/replicas
  values:
    connect:
      annotations:
        reloader.stakater.com/auto: "true"
      api:
        httpPort: 80
        imageRepository: ghcr.io/1password/connect-api
        serviceMonitor:
          enabled: true
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 128Mi
      credentialsName: onepassword-connect-credentials-secret
      sync:
        imageRepository: ghcr.io/1password/connect-sync
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 128Mi
      hpa:
        enabled: false
      pdb:
        enabled: true
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: onepassword-connect
                topologyKey: topology.kubernetes.io/region
            - weight: 50
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: onepassword-connect
                topologyKey: kubernetes.io/hostname
