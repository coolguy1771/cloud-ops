---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
# L3/L4 defense-in-depth for onepassword-connect. Based on observed traffic (ztunnel
# access logs, 6h window): only the external-secrets controller calls it, in-namespace.
# Port 15008 (ztunnel HBONE) must stay allowed — see kubernetes/apps/flux-system/flux-operator.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: onepassword-connect-ingress
spec:
  endpointSelector:
    matchLabels:
      app: onepassword-connect
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: external-secrets
            app.kubernetes.io/name: external-secrets
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "15008"
              protocol: TCP
