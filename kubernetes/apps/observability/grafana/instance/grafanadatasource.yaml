---
# Default user datasources: external URLs + oauthPassThru (JWT tenant_id -> X-Scope-OrgID).
# Admins query other tenants via grafanadatasource-admin-tenants.yaml (fixed X-Scope-OrgID).
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/grafana.integreatly.org/grafanadatasource_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: prometheus
spec:
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  datasource:
    type: prometheus
    name: prometheus
    uid: prometheus
    access: proxy
    isDefault: true
    url: https://mimir.cloud.witl.xyz/prometheus
    editable: false
    jsonData:
      timeInterval: "15s"
      httpMethod: POST
      implementation: mimir
      oauthPassThru: true
      timeout: 300
---
# Mimir Alertmanager (witl-xyz tenant). Unlike the prometheus/loki/tempo
# datasources, this one CANNOT use oauthPassThru + the external URL: those
# datasources hit query endpoints that support tenant federation, so the
# user's JWT tenant_id claim may carry multiple pipe-delimited tenants
# (e.g. witl-xyz|icbplays-net). The Alertmanager API is a single-tenant
# *config* API and rejects a multi-tenant X-Scope-OrgID with 401
# "multiple org IDs present" (and 401 "no org id" when the OAuth token
# can't be refreshed). Target one fixed tenant via the in-cluster URL with
# a static X-Scope-OrgID header, the same pattern as the admin-tenant
# datasources in grafanadatasource-admin-tenants.yaml.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/grafana.integreatly.org/grafanadatasource_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: alertmanager
spec:
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  datasource:
    type: alertmanager
    name: alertmanager
    uid: alertmanager
    access: proxy
    editable: false
    url: http://mimir-app.mimir-system.svc.cluster.local:8080
    jsonData:
      implementation: mimir
      httpHeaderName1: X-Scope-OrgID
      timeout: 300
    secureJsonData:
      httpHeaderValue1: witl-xyz
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/grafana.integreatly.org/grafanadatasource_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: loki
spec:
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  datasource:
    type: loki
    name: loki
    uid: loki
    access: proxy
    editable: false
    url: https://loki.cloud.witl.xyz
    jsonData:
      oauthPassThru: true
      timeout: 300
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/grafana.integreatly.org/grafanadatasource_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: tempo
spec:
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  datasource:
    type: tempo
    name: tempo
    uid: tempo
    access: proxy
    editable: false
    url: https://tempo.cloud.witl.xyz
    jsonData:
      oauthPassThru: true
      tracesToLogsV2:
        datasourceUid: loki
      serviceMap:
        datasourceUid: prometheus
