---
# Default user datasources: external URLs + oauthPassThru (JWT tenant_id -> X-Scope-OrgID).
# Admins query other tenants via grafanadatasource-admin-tenants.yaml (fixed X-Scope-OrgID).
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/grafana.integreatly.org/grafanadatasource_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: prometheus
spec:
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  datasource:
    type: prometheus
    name: prometheus
    uid: prometheus
    access: proxy
    isDefault: true
    url: https://mimir.cloud.witl.xyz/prometheus
    editable: false
    jsonData:
      timeInterval: "15s"
      httpMethod: POST
      implementation: mimir
      oauthPassThru: true
      timeout: 120
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/grafana.integreatly.org/grafanadatasource_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: alertmanager
spec:
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  datasource:
    type: alertmanager
    name: alertmanager
    uid: alertmanager
    access: proxy
    editable: false
    jsonData:
      implementation: mimir
      oauthPassThru: true
      timeout: 120
    url: https://mimir.cloud.witl.xyz
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/grafana.integreatly.org/grafanadatasource_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: loki
spec:
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  datasource:
    type: loki
    name: loki
    uid: loki
    access: proxy
    editable: false
    url: https://loki.cloud.witl.xyz
    jsonData:
      oauthPassThru: true
      timeout: 120
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/grafana.integreatly.org/grafanadatasource_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: tempo
spec:
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  datasource:
    type: tempo
    name: tempo
    uid: tempo
    access: proxy
    editable: false
    url: https://tempo.cloud.witl.xyz
    jsonData:
      oauthPassThru: true
      tracesToLogsV2:
        datasourceUid: loki
      serviceMap:
        datasourceUid: prometheus
