---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/grafana.integreatly.org/grafana_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  labels:
    grafana.internal/instance: grafana
    dashboards: "grafana"
spec:
  config:
    feature_toggles:
      enable: "provisioning,kubernetesDashboards"
    log:
      mode: "console"
    security:
      admin_user: "admin"
      angular_support_enabled: "true"
    server:
      enable_gzip: "true"
      root_url: "https://grafana.cloud.witl.xyz"
      # Honor X-Forwarded-* from Istio Gateway (real client IP / scheme).
      serve_from_sub_path: "false"
    analytics:
      check_for_updates: "false"
      check_for_plugin_updates: "false"
      feedback_links_enabled: "false"
      reporting_enabled: "false"
    auth:
      disable_login_form: "true"
    auth.generic_oauth:
      enabled: "true"
      name: "Authentik"
      allow_sign_up: "true"
      allow_insecure_email_lookup: "true"
      scopes: "openid profile email tenant"
      auth_url: "https://auth.cloud.witl.xyz/application/o/authorize/"
      token_url: "https://auth.cloud.witl.xyz/application/o/token/"
      api_url: "https://auth.cloud.witl.xyz/application/o/userinfo/"
      name_attribute_path: "name"
      login_attribute_path: "email"
      email_attribute_path: "email"
      role_attribute_path: "(contains(groups[*], 'Grafana Access') || contains(groups[*], 'Observability Superuser')) && 'Admin' || 'Viewer'"
      use_pkce: "true"
      use_refresh_token: "true"
    auth.jwt:
      enabled: "true"
      header_name: Authorization
      email_claim: sub
      username_claim: sub
      jwk_set_url: "https://auth.cloud.witl.xyz/application/o/grafana-kiali-m2m/jwks/"
      expect_claims: '{"iss":"https://auth.cloud.witl.xyz/application/o/grafana-kiali-m2m/"}'
      auto_sign_up: "true"
      role_attribute_path: "'Viewer'"
    auth.anonymous:
      enabled: "false"
    database:
      # Direct to the CNPG primary service, not postgres-pooler-rw: PgBouncer's
      # transaction pooling mode breaks Grafana's server-side prepared statements
      # (queries can land on a different backend connection mid-session), causing
      # silent "prepared statement does not exist" failures across alerting, auth
      # token cleanup, secret migration, and usage stats. Grafana keeps its own
      # connection pool, so it doesn't need PgBouncer in front of it anyway.
      type: postgres
      host: postgres-rw.database.svc.cluster.local:5432
      name: grafana
      user: grafana
      ssl_mode: verify-full
      ca_cert_path: /etc/ssl/certs/postgres-ca.crt
    metrics:
      enabled: "true"
    news:
      news_feed_enabled: "false"
    plugins:
      plugin_admin_enabled: "false"
  deployment:
    spec:
      strategy:
        type: Recreate
      template:
        spec:
          containers:
            - name: grafana
              env:
                - name: GF_SECURITY_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: grafana-admin-password-secret
                      key: GF_SECURITY_ADMIN_PASSWORD
                - name: GF_AUTH_GENERIC_OAUTH_CLIENT_ID
                  valueFrom:
                    secretKeyRef:
                      name: grafana-oauth
                      key: client-id
                - name: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: grafana-oauth
                      key: client-secret
                - name: GF_AUTH_GENERIC_OAUTH_AUTH_URL
                  value: https://auth.cloud.witl.xyz/application/o/authorize/
                - name: GF_AUTH_GENERIC_OAUTH_TOKEN_URL
                  value: https://auth.cloud.witl.xyz/application/o/token/
                - name: GF_AUTH_GENERIC_OAUTH_API_URL
                  value: https://auth.cloud.witl.xyz/application/o/userinfo/
                - name: GF_DATABASE_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: grafana-db-password
                      key: GF_DATABASE_PASSWORD
              volumeMounts:
                - name: postgres-ca
                  mountPath: /etc/ssl/certs/postgres-ca.crt
                  subPath: ca.crt
                  readOnly: true
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
          volumes:
            # emptyDir, not a PVC: /var/lib/grafana only holds regenerable state now
            # that the DB is on Postgres (plugin cache copied from the image on each
            # start, local unified-search index rebuilt from Postgres, ephemeral
            # csv/pdf/png export scratch space). Still needed as a volume because
            # readOnlyRootFilesystem is set below.
            - name: grafana-data
              emptyDir: {}
            - name: postgres-ca
              secret:
                secretName: postgres-ca
  httpRoute:
    spec:
      hostnames:
        - grafana.cloud.witl.xyz
      parentRefs:
        - name: istio
          namespace: istio-ingress
          sectionName: https
      rules:
        - backendRefs:
            - name: grafana-service
              port: 3000
  disableDefaultSecurityContext: All