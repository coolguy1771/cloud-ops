---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/grafana.integreatly.org/grafana_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  labels:
    grafana.internal/instance: grafana
    dashboards: "grafana"
spec:
  config:
    feature_toggles:
      enable: "provisioning,kubernetesDashboards"
    log:
      mode: "console"
    security:
      admin_user: "admin"
      angular_support_enabled: "true"
    server:
      enable_gzip: "true"
      root_url: "https://grafana.cloud.witl.xyz"
      # Honor X-Forwarded-* from Istio Gateway (real client IP / scheme).
      serve_from_sub_path: "false"
    analytics:
      check_for_updates: "false"
      check_for_plugin_updates: "false"
      feedback_links_enabled: "false"
      reporting_enabled: "false"
    auth:
      disable_login_form: "true"
    auth.generic_oauth:
      enabled: "true"
      name: "Authentik"
      allow_sign_up: "true"
      allow_insecure_email_lookup: "true"
      scopes: "openid profile email tenant"
      auth_url: "https://auth.cloud.witl.xyz/application/o/authorize/"
      token_url: "https://auth.cloud.witl.xyz/application/o/token/"
      api_url: "https://auth.cloud.witl.xyz/application/o/userinfo/"
      name_attribute_path: "name"
      login_attribute_path: "email"
      email_attribute_path: "email"
      role_attribute_path: "(contains(groups[*], 'Grafana Access') || contains(groups[*], 'Observability Superuser')) && 'Admin' || 'Viewer'"
      use_pkce: "true"
      use_refresh_token: "true"
    auth.jwt:
      enabled: "true"
      header_name: Authorization
      email_claim: sub
      username_claim: sub
      jwk_set_url: "https://auth.cloud.witl.xyz/application/o/grafana-kiali-m2m/jwks/"
      expect_claims: '{"iss":"https://auth.cloud.witl.xyz/application/o/grafana-kiali-m2m/"}'
      auto_sign_up: "true"
      role_attribute_path: "'Viewer'"
    auth.anonymous:
      enabled: "false"
    database:
      # postgres-rw directly, not postgres-pooler-rw: PgBouncer's transaction pooling
      # breaks Grafana's server-side prepared statements.
      type: postgres
      host: postgres-rw.database.svc.cluster.local:5432
      name: grafana
      user: grafana
      ssl_mode: verify-full
      ca_cert_path: /etc/ssl/certs/postgres-ca.crt
    metrics:
      enabled: "true"
    news:
      news_feed_enabled: "false"
    plugins:
      plugin_admin_enabled: "false"
  deployment:
    spec:
      # Fixed replicas: grafana-operator reconciles Deployment.replicas and
      # fights KEDA/HPA (resets to 1). Scale via this field, not a ScaledObject.
      replicas: 2
      strategy:
        type: RollingUpdate
      template:
        spec:
          affinity:
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    labelSelector:
                      matchLabels:
                        app: grafana
                    topologyKey: topology.kubernetes.io/region
                - weight: 50
                  podAffinityTerm:
                    labelSelector:
                      matchLabels:
                        app: grafana
                    topologyKey: kubernetes.io/hostname
          containers:
            - name: grafana
              env:
                - name: GF_SECURITY_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: grafana-admin-password-secret
                      key: GF_SECURITY_ADMIN_PASSWORD
                - name: GF_AUTH_GENERIC_OAUTH_CLIENT_ID
                  valueFrom:
                    secretKeyRef:
                      name: grafana-oauth
                      key: client-id
                - name: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: grafana-oauth
                      key: client-secret
                - name: GF_AUTH_GENERIC_OAUTH_AUTH_URL
                  value: https://auth.cloud.witl.xyz/application/o/authorize/
                - name: GF_AUTH_GENERIC_OAUTH_TOKEN_URL
                  value: https://auth.cloud.witl.xyz/application/o/token/
                - name: GF_AUTH_GENERIC_OAUTH_API_URL
                  value: https://auth.cloud.witl.xyz/application/o/userinfo/
                - name: GF_DATABASE_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: grafana-db-password
                      key: GF_DATABASE_PASSWORD
              volumeMounts:
                - name: postgres-ca
                  mountPath: /etc/ssl/certs/postgres-ca.crt
                  subPath: ca.crt
                  readOnly: true
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
          volumes:
            # emptyDir: /var/lib/grafana only holds regenerable state now that the DB is on Postgres.
            - name: grafana-data
              emptyDir: {}
            - name: postgres-ca
              secret:
                secretName: postgres-ca
  httpRoute:
    spec:
      hostnames:
        - grafana.cloud.witl.xyz
      parentRefs:
        - name: istio
          namespace: istio-ingress
          sectionName: https
      rules:
        - backendRefs:
            - name: grafana-service
              port: 3000
  disableDefaultSecurityContext: All