---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin-password
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: grafana-admin-password-secret
    template:
      data:
        GF_SECURITY_ADMIN_PASSWORD: "{{ .GF_SECURITY_ADMIN_PASSWORD }}"
  dataFrom:
    - extract:
        key: grafana
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-oauth
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: grafana-oauth
  data:
    - secretKey: client-id
      remoteRef:
        key: grafana-oauth
        property: client_id
    - secretKey: client-secret
      remoteRef:
        key: grafana-oauth
        property: client_secret
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Named tenant for in-cluster writers (Alloy, istiod, Kiali). Default is witl-xyz
# (shared with the home-ops cluster). Grafana users get tenant_id from OAuth.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-datasource-org
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: grafana-datasource-org
    creationPolicy: Owner
  data:
    - secretKey: ORG_ID
      remoteRef:
        key: grafana-datasource-org
        property: org-id
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# 1Password item "grafana-db": password (username is fixed to grafana)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-db-password
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: grafana-db-password
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        GF_DATABASE_PASSWORD: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: grafana-db
        property: password
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Sync Postgres server CA from database namespace for verify-full TLS.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-ca
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: kubernetes-database
  target:
    name: postgres-ca
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        ca.crt: "{{ .ca }}"
  data:
    - secretKey: ca
      remoteRef:
        key: postgres-server-cert
        property: ca.crt