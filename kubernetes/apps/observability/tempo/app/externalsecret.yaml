---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Populates Secret tempo-r2-credentials for Tempo's Cloudflare R2 trace backend.
# Create a 1Password item "tempo" with fields: s3_endpoint, s3_access_key_id,
# s3_secret_access_key, tempo_bucket_traces.
# R2: endpoint is https://<ACCOUNT_ID>.r2.cloudflarestorage.com; access key/secret
# come from an R2 API token (Object Read & Write) in the Cloudflare dashboard.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tempo-r2-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: tempo-r2-credentials
    creationPolicy: Owner
  data:
    - secretKey: S3_ENDPOINT
      remoteRef:
        key: tempo
        property: s3_endpoint
    - secretKey: S3_ACCESS_KEY_ID
      remoteRef:
        key: tempo
        property: s3_access_key_id
    - secretKey: S3_SECRET_ACCESS_KEY
      remoteRef:
        key: tempo
        property: s3_secret_access_key
    - secretKey: TEMPO_BUCKET_TRACES
      remoteRef:
        key: tempo
        property: tempo_bucket_traces
