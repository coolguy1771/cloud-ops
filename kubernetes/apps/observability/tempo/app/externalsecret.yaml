---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tempo-r2-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: tempo-r2-credentials
    creationPolicy: Owner
  data:
    - secretKey: S3_ENDPOINT
      remoteRef:
        key: tempo
        property: s3_endpoint
    - secretKey: S3_ACCESS_KEY_ID
      remoteRef:
        key: tempo
        property: s3_access_key_id
    - secretKey: S3_SECRET_ACCESS_KEY
      remoteRef:
        key: tempo
        property: s3_secret_access_key
    - secretKey: TEMPO_BUCKET_TRACES
      remoteRef:
        key: tempo
        property: tempo_bucket_traces
