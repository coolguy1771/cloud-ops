---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tempo
spec:
  chartRef:
    kind: OCIRepository
    name: tempo
  interval: 1h
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: HorizontalPodAutoscaler
              name: tempo-distributor
            patch: |
              $patch: delete
              apiVersion: autoscaling/v2
              kind: HorizontalPodAutoscaler
              metadata:
                name: tempo-distributor
          - target:
              kind: HorizontalPodAutoscaler
              name: tempo-querier
            patch: |
              $patch: delete
              apiVersion: autoscaling/v2
              kind: HorizontalPodAutoscaler
              metadata:
                name: tempo-querier
          - target:
              kind: HorizontalPodAutoscaler
              name: tempo-query-frontend
            patch: |
              $patch: delete
              apiVersion: autoscaling/v2
              kind: HorizontalPodAutoscaler
              metadata:
                name: tempo-query-frontend
  values:
    fullnameOverride: tempo
    multitenancyEnabled: true
    traces:
      otlp:
        http:
          enabled: true
        grpc:
          enabled: true
    storage:
      trace:
        backend: s3
        s3:
          bucket: "${TEMPO_BUCKET_TRACES}"
          endpoint: "${S3_ENDPOINT}"
          region: "auto"
          access_key: "${S3_ACCESS_KEY_ID}"
          secret_key: "${S3_SECRET_ACCESS_KEY}"
          forcepathstyle: true
          insecure: false
    ingester:
      replicas: 3
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 1Gi
      extraArgs:
        - "-config.expand-env=true"
      extraEnvFrom:
        - secretRef:
            name: tempo-r2-credentials
      persistence:
        enabled: true
        size: 10Gi
        storageClass: hcloud-volumes
      config:
        replication_factor: 3
    distributor:
      autoscaling:
        enabled: true
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
      extraArgs:
        - "-config.expand-env=true"
      extraEnvFrom:
        - secretRef:
            name: tempo-r2-credentials
    querier:
      autoscaling:
        enabled: true
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
      extraArgs:
        - "-config.expand-env=true"
      extraEnvFrom:
        - secretRef:
            name: tempo-r2-credentials
    queryFrontend:
      autoscaling:
        enabled: true
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
      extraArgs:
        - "-config.expand-env=true"
      extraEnvFrom:
        - secretRef:
            name: tempo-r2-credentials
    compactor:
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
      extraArgs:
        - "-config.expand-env=true"
      extraEnvFrom:
        - secretRef:
            name: tempo-r2-credentials
    memcached:
      replicas: 1
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 512Mi
    # TraceQL metrics ({ } | rate()) need the generator ring + local-blocks.
    metricsGenerator:
      enabled: true
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
      extraArgs:
        - "-config.expand-env=true"
      extraEnvFrom:
        - secretRef:
            name: tempo-r2-credentials
      config:
        processor:
          local_blocks:
            filter_server_spans: false
            flush_to_storage: true
    overrides:
      defaults:
        metrics_generator:
          processors:
            - local-blocks
    gateway:
      enabled: false
    metaMonitoring:
      serviceMonitor:
        enabled: true
