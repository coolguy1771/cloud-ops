---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: k8s-monitoring
spec:
  dependsOn:
    - name: k8s-monitoring-secrets
      namespace: observability
    - name: mimir
      namespace: mimir-system
  interval: 1h
  path: ./kubernetes/apps/observability/k8s-monitoring/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: observability
  wait: false
