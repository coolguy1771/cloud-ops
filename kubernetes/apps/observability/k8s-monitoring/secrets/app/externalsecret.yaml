---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: k8s-monitoring-mimir-org
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: k8s-monitoring-mimir-org
  data:
    - secretKey: tenantId
      remoteRef:
        key: grafana-datasource-org
        property: org-id
---
# 1Password item "alloy-postgres": password (username fixed to alloy_monitoring)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alloy-postgres-monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: alloy-postgres-monitoring
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        username: alloy_monitoring
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: alloy-postgres
        property: password
