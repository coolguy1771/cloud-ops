---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-monitoring
spec:
  chartRef:
    kind: OCIRepository
    name: k8s-monitoring
  dependsOn:
    - name: mimir
      namespace: mimir-system
  interval: 1h
  timeout: 15m
  values:
    cluster:
      name: cloud-ops
    destinations:
      mimir:
        type: prometheus
        url: http://mimir-app.mimir-system.svc.cluster.local:8080/api/v1/push
        secret:
          create: false
          name: k8s-monitoring-mimir-org
        tenantIdKey: tenantId
      tempo:
        type: otlp
        protocol: http
        url: http://tempo-distributor.observability.svc.cluster.local:4318
        secret:
          create: false
          name: k8s-monitoring-mimir-org
        tenantIdKey: tenantId
        metrics:
          enabled: false
        logs:
          enabled: false
        traces:
          enabled: true
        processors:
          # Trace-derived edges → Mimir; dns resolver avoids API watch load.
          serviceGraphMetrics:
            enabled: true
            destinations:
              - mimir
            loadBalancer:
              resolver: dns
            collector:
              controller:
                replicas: 2
    # One kubernetesEnrichment processor per feature, not one shared by all: the chart
    # renders each feature's referenced processor as its own set of Alloy blocks named
    # after the processor key, with no dedup across features. Four features sharing one
    # "k8s-metadata" key against the same metrics/prometheus pipeline type produced 4x
    # duplicate block declarations (prometheus.relabel/enrich "..._metrics_prometheus"),
    # which crashlooped every alloy-metrics pod on config load.
    dataProcessors:
      k8s-metadata-cluster: &k8sMetadata
        type: kubernetesEnrichment
        podLabels:
          app: app.kubernetes.io/name
          component: app.kubernetes.io/component
          part_of: app.kubernetes.io/part-of
          instance: app.kubernetes.io/instance
        namespaceLabels:
          istio_dataplane: istio.io/dataplane-mode
      k8s-metadata-host: *k8sMetadata
      k8s-metadata-annotation: *k8sMetadata
      k8s-metadata-operator: *k8sMetadata
      k8s-metadata-app: *k8sMetadata
    clusterMetrics:
      enabled: true
      collector: alloy-metrics
      dataProcessors:
        - k8s-metadata-cluster
    hostMetrics:
      enabled: true
      collector: alloy-metrics
      dataProcessors:
        - k8s-metadata-host
      nodeLabels:
        region: true
        availabilityZone: true
        nodeRole: true
        nodeOS: true
        nodeArchitecture: true
        instanceType: true
      linuxHosts:
        enabled: true
    annotationAutodiscovery:
      enabled: true
      collector: alloy-metrics
      dataProcessors:
        - k8s-metadata-annotation
      nodeLabels:
        region: true
        availabilityZone: true
        nodeRole: true
        nodeOS: true
        nodeArchitecture: true
        instanceType: true
    prometheusOperatorObjects:
      enabled: true
      collector: alloy-metrics
      dataProcessors:
        - k8s-metadata-operator
    applicationObservability:
      enabled: true
      collector: alloy-receiver
      dataProcessors:
        - k8s-metadata-app
      metrics:
        enabled: false
      logs:
        enabled: false
      traces:
        enabled: true
      receivers:
        otlp:
          grpc:
            enabled: true
            port: 4317
          http:
            enabled: true
            port: 4318
    clusterEvents:
      enabled: false
    podLogsViaKubernetesApi:
      enabled: false
    autoInstrumentation:
      enabled: false
    profiling:
      enabled: false
    selfReporting:
      enabled: false
    integrations:
      collector: alloy-metrics
      istio:
        instances:
          - name: istio
            # Ambient: no sidecars; ztunnel/waypoints scraped via PodMonitors.
            sidecarMetrics:
              enabled: false
            istiodMetrics:
              enabled: true
              namespace: istio-system
              serviceName: istiod
      cert-manager:
        instances:
          - name: cert-manager
            namespace: cert-manager
            labelSelectors:
              app.kubernetes.io/name: cert-manager
      alloy:
        instances:
          - name: alloy
            labelSelectors:
              app.kubernetes.io/name:
                - alloy-metrics
                - alloy-receiver
      postgresql:
        instances:
          - name: postgres
            exporter:
              dataSource:
                host: postgres-rw.database.svc.cluster.local
                port: 5432
                database: postgres
                sslmode: require
                auth:
                  usernameKey: username
                  passwordKey: password
            secret:
              create: false
              name: alloy-postgres-monitoring
              namespace: observability
            logs:
              enabled: false
    telemetryServices:
      kube-state-metrics:
        deploy: true
      node-exporter:
        deploy: true
    collectors:
      alloy-metrics:
        presets:
          - clustered
        alloy:
          # Required for prometheus.enrich (kubernetesEnrichment on metrics).
          stabilityLevel: experimental
          clustering:
            portName: tcp
      alloy-receiver: {}
