---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
spec:
  chartRef:
    kind: OCIRepository
    name: loki
  interval: 1h
  # autoscaling.enabled per component omits chart-managed replicas so KEDA can own
  # them, but also renders the chart's own HPA — remove those so only KEDA's HPA exists.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: HorizontalPodAutoscaler
              name: loki-write
            patch: |
              $patch: delete
              apiVersion: autoscaling/v2
              kind: HorizontalPodAutoscaler
              metadata:
                name: loki-write
          - target:
              kind: HorizontalPodAutoscaler
              name: loki-read
            patch: |
              $patch: delete
              apiVersion: autoscaling/v2
              kind: HorizontalPodAutoscaler
              metadata:
                name: loki-read
          - target:
              kind: HorizontalPodAutoscaler
              name: loki-backend
            patch: |
              $patch: delete
              apiVersion: autoscaling/v2
              kind: HorizontalPodAutoscaler
              metadata:
                name: loki-backend
  values:
    deploymentMode: SimpleScalable
    loki:
      commonConfig:
        replication_factor: 1
      schemaConfig:
        configs:
          - from: "2024-04-01"
            store: tsdb
            object_store: s3
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
      pattern_ingester:
        enabled: true
      limits_config:
        allow_structured_metadata: true
        volume_enabled: true
      ruler:
        enable_api: true
      storage:
        type: s3
        bucketNames:
          chunks: "${LOKI_BUCKET_CHUNKS}"
          ruler: "${LOKI_BUCKET_RULER}"
          admin: "${LOKI_BUCKET_ADMIN}"
        s3:
          endpoint: "${S3_ENDPOINT}"
          region: "auto"
          accessKeyId: "${S3_ACCESS_KEY_ID}"
          secretAccessKey: "${S3_SECRET_ACCESS_KEY}"
          s3ForcePathStyle: false
          insecure: false
    minio:
      enabled: false
    singleBinary:
      replicas: 0
    write:
      autoscaling:
        enabled: true
      resources:
        requests:
          cpu: 200m
          memory: 256Mi
        limits:
          cpu: 1000m
          memory: 1Gi
      extraArgs:
        - "-config.expand-env=true"
      extraEnvFrom:
        - secretRef:
            name: loki-tigris-credentials
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/region
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: write
    read:
      autoscaling:
        enabled: true
      resources:
        requests:
          cpu: 200m
          memory: 256Mi
        limits:
          cpu: 1000m
          memory: 1Gi
      extraArgs:
        - "-config.expand-env=true"
      extraEnvFrom:
        - secretRef:
            name: loki-tigris-credentials
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/region
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: read
    backend:
      autoscaling:
        enabled: true
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 1Gi
      extraArgs:
        - "-config.expand-env=true"
      extraEnvFrom:
        - secretRef:
            name: loki-tigris-credentials
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/region
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: backend
    resultsCache:
      resources:
        requests:
          cpu: 500m
          memory: 1024Mi
        limits:
          cpu: 1000m
          memory: 1229Mi
    sidecar:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi
    gateway:
      enabled: false
    monitoring:
      serviceMonitor:
        enabled: true
    test:
      enabled: false
    lokiCanary:
      enabled: false
    chunksCache:
      enabled: false