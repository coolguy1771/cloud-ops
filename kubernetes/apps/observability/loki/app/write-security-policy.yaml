---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: loki-write-jwt
  namespace: observability
spec:
  targetSelectors:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      matchLabels:
        app: loki-write
  jwt:
    providers:
      - name: authentik-observability-m2m
        issuer: "https://auth.cloud.witl.xyz/application/o/observability-m2m/"
        remoteJWKS:
          uri: "https://auth.cloud.witl.xyz/application/o/observability-m2m/jwks/"
        claimToHeaders:
          - claim: tenant_id
            header: X-Scope-OrgID
  authorization:
    defaultAction: Deny
    rules:
      - name: m2m-write
        action: Allow
        principal:
          jwt:
            provider: authentik-observability-m2m
            scopes:
              - loki:write
