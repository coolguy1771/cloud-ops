---
# Persist certificate and key as separate 1Password items. The 1Password
# PushSecret provider cannot reliably update two properties on one item.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: cloud-witl-xyz-tls-crt
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - name: onepassword-connect
      kind: ClusterSecretStore
  selector:
    secret:
      name: cloud-witl-xyz-tls
  template:
    data:
      value: '{{ index . "tls.crt" | b64enc }}'
  data:
    - match:
        secretKey: tls.crt
        remoteRef:
          remoteKey: cloud-witl-xyz-tls-crt
          property: value
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: cloud-witl-xyz-tls-key
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - name: onepassword-connect
      kind: ClusterSecretStore
  selector:
    secret:
      name: cloud-witl-xyz-tls
  template:
    data:
      value: '{{ index . "tls.key" | b64enc }}'
  data:
    - match:
        secretKey: tls.key
        remoteRef:
          remoteKey: cloud-witl-xyz-tls-key
          property: value
