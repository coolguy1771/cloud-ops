---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Flux postBuild substitutes CLOUDFLARE_ACCOUNT_ID into tempo-r2 ServiceEntry.
# Applied by mesh-egress-secrets before mesh-egress (dependsOn), so the Secret
# exists when substituteFrom runs — same chicken-egg pattern as CNPG/tunnel bootstrap.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-account-id
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: cloudflare-account-id-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        CLOUDFLARE_ACCOUNT_ID: "{{ .account_tag }}"
  data:
    - secretKey: account_tag
      remoteRef:
        key: cloudflare
        property: account_tag
