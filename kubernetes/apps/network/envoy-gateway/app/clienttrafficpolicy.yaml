---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.envoyproxy.io/clienttrafficpolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: envoy-gateway
spec:
  clientIPDetection:
    xForwardedFor:
      numTrustedHops: 1
  connection:
    bufferLimit: 32Ki
    connectionLimit:
      value: 10000
      closeDelay: 5s
  timeout:
    http:
      requestReceivedTimeout: 60s
      idleTimeout: 300s
  tcpKeepalive:
    idleTime: 1200s
    interval: 60s
    probes: 3
  http2:
    onInvalidMessage: TerminateStream
    initialConnectionWindowSize: 1Mi
    initialStreamWindowSize: 64Ki
    maxConcurrentStreams: 100
  tls:
    minVersion: "1.2"
    maxVersion: "1.3"
    alpnProtocols:
      - h2
      - http/1.1
  targetSelectors:
    - group: gateway.networking.k8s.io
      kind: Gateway
