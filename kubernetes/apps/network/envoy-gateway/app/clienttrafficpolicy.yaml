---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.envoyproxy.io/clienttrafficpolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: envoy-gateway
spec:
  # Cloudflare proxy chain — trust the first hop
  clientIPDetection:
    xForwardedFor:
      numTrustedHops: 1
  # Connection limits to prevent resource exhaustion / slowloris attacks
  connection:
    bufferLimit: 32Ki
    connectionLimit:
      value: 10000
      closeDelay: 5s
  # Timeouts — protect against slow clients while allowing long-polling
  timeout:
    http:
      requestReceivedTimeout: 60s
      idleTimeout: 300s
  # TCP keepalive for upstream connections
  tcpKeepalive:
    idleTime: 1200s
    interval: 60s
    probes: 3
  # HTTP/2 tuning — reasonable limits that balance throughput and safety
  http2:
    onInvalidMessage: TerminateStream
    initialConnectionWindowSize: 1Mi
    initialStreamWindowSize: 64Ki
    maxConcurrentStreams: 100
  # TLS hardening — match industry best practices (TLS 1.3 preferred)
  tls:
    minVersion: "1.2"
    maxVersion: "1.3"
    alpnProtocols:
      - h2
      - http/1.1
  targetSelectors:
    - group: gateway.networking.k8s.io
      kind: Gateway
