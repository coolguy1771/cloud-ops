---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
# L3/L4 defense-in-depth: source-namespace scoping for postgres + poolers, based on
# observed traffic (ztunnel access logs, 6h window). Port 15008 (ztunnel HBONE) must
# stay allowed alongside real ports — see kubernetes/apps/flux-system/flux-operator
# for why. Fine-grained per-port/per-identity enforcement (authentik can only use
# 5432, alloy can only use 9187/9127) lives in the paired AuthorizationPolicy, since
# Cilium can't see past the HBONE tunnel for ambient mesh traffic.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: database-ingress
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: postgres
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: authentik
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
            - port: "15008"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: alloy-metrics
      toPorts:
        - ports:
            - port: "9187"
              protocol: TCP
            - port: "9127"
              protocol: TCP
            - port: "15008"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            cnpg.io/cluster: postgres
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
            - port: "8000"
              protocol: TCP
            - port: "15008"
              protocol: TCP
