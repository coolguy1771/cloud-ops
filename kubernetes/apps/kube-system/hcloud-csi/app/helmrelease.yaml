---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hcloud-csi
spec:
  chart:
    spec:
      chart: hcloud-csi
      version: "2.22.1"
      sourceRef:
        kind: HelmRepository
        name: hcloud-csi
      interval: 15m
  interval: 1h
  targetNamespace: kube-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    controller:
      hcloudToken:
        value: ""
        existingSecret:
          name: hcloud-csi
          key: token
      hcloudVolumeDefaultLocation: "fsn1"
      resources:
        csiAttacher:
          requests: {cpu: 10m, memory: 32Mi}
          limits: {cpu: 100m, memory: 128Mi}
        csiResizer:
          requests: {cpu: 10m, memory: 32Mi}
          limits: {cpu: 100m, memory: 128Mi}
        csiProvisioner:
          requests: {cpu: 10m, memory: 32Mi}
          limits: {cpu: 100m, memory: 128Mi}
        livenessProbe:
          requests: {cpu: 10m, memory: 32Mi}
          limits: {cpu: 100m, memory: 128Mi}
        hcloudCSIDriver:
          requests: {cpu: 25m, memory: 64Mi}
          limits: {cpu: 200m, memory: 256Mi}
    node:
      kubeletDir: /var/lib/kubelet
      affinity: {}
      resources:
        csiNodeDriverRegistrar:
          requests: {cpu: 10m, memory: 32Mi}
          limits: {cpu: 100m, memory: 128Mi}
        livenessProbe:
          requests: {cpu: 10m, memory: 32Mi}
          limits: {cpu: 100m, memory: 128Mi}
        hcloudCSIDriver:
          requests: {cpu: 25m, memory: 64Mi}
          limits: {cpu: 200m, memory: 256Mi}
    storageClasses:
      - name: hcloud-volumes
        defaultStorageClass: true
        reclaimPolicy: Delete
