---
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-grafana
data:
  grafana.yaml: |
    version: 1
    metadata:
      name: grafana-oauth
    entries:
      - model: authentik_core.group
        id: grafana-access-group
        state: present
        identifiers:
          name: Grafana Access
        attrs:
          name: Grafana Access
      - model: authentik_providers_oauth2.oauth2provider
        id: grafana-provider
        state: present
        identifiers:
          name: Grafana
        attrs:
          name: Grafana
          client_type: confidential
          # client_id / client_secret omitted: Authentik generates both.
          # Copy into 1Password item grafana-oauth (vault cloud-ops) for Grafana.
          redirect_uris:
            - matching_mode: strict
              url: https://grafana.cloud.witl.xyz/login/generic_oauth
            - matching_mode: strict
              url: https://grafana.cloud.witl.xyz/
          sub_mode: user_email
          include_claims_in_id_token: true
          issuer_mode: per_provider
          authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      - model: authentik_core.application
        id: grafana-app
        state: present
        identifiers:
          slug: grafana
        attrs:
          name: Grafana
          slug: grafana
          policy_engine_mode: any
          provider: !KeyOf grafana-provider
      - model: authentik_policies.policybinding
        id: grafana-access-binding
        state: present
        identifiers:
          order: 0
          target: !KeyOf grafana-app
        attrs:
          order: 0
          target: !KeyOf grafana-app
          group: !KeyOf grafana-access-group
