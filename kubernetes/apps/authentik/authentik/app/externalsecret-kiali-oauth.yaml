---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Same 1Password item as istio-system/kiali; used by Authentik blueprint via !Env.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kiali-oauth
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kiali-oauth
    template:
      engineVersion: v2
      data:
        client_secret: "{{ .client_secret }}"
  dataFrom:
    - extract:
        key: kiali-oauth
