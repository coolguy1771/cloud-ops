---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/v1/configmap.json
# Authentik blueprint (auto-discovered via blueprints.configMaps in helmrelease.yaml):
# OAuth2 client_credentials provider for Tempo M2M ingestion, replacing the Duo M2M app.
#
# client_id/client_secret are intentionally left unset so authentik generates them; they
# are not needed here (Istio's ingress gateway only validates the JWT against the JWKS
# below, see istio-ingress/gateway/app/tempo-requestauthentication.yaml) and must be
# fetched from the authentik admin UI (Applications > tempo > Provider) and handed
# out-of-band to whoever pushes traces (e.g. this cluster's own Alloy, or home-ops).
#
# Per https://docs.goauthentik.io/docs/add-secure-apps/providers/oauth2/client_credentials:
# calling POST /application/o/token/ with grant_type=client_credentials and this
# provider's client_id/client_secret makes authentik auto-create a service account
# `ak-tempo-m2m-client_credentials` and issue the JWT for it; its `sub` claim (stable,
# opaque) is what outputClaimToHeaders maps to X-Scope-OrgID.
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-tempo-m2m
data:
  tempo-m2m.yaml: |
    version: 1
    metadata:
      name: Tempo M2M (client credentials)
    entries:
      - model: authentik_providers_oauth2.scopemapping
        id: tempo-scope-read
        state: present
        identifiers:
          scope_name: "tempo:read"
        attrs:
          name: "Tempo: read"
          scope_name: "tempo:read"
          description: "Read access to Tempo's trace query API"
          expression: "return {}"
      - model: authentik_providers_oauth2.scopemapping
        id: tempo-scope-write
        state: present
        identifiers:
          scope_name: "tempo:write"
        attrs:
          name: "Tempo: write"
          scope_name: "tempo:write"
          description: "Write access to Tempo's OTLP ingestion endpoint"
          expression: "return {}"
      - model: authentik_providers_oauth2.oauth2provider
        id: tempo-m2m-provider
        state: present
        identifiers:
          name: tempo-m2m
        attrs:
          name: tempo-m2m
          client_type: confidential
          redirect_uris: []
          grant_types:
            - client_credentials
          issuer_mode: per_provider
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "tempo:read"]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, "tempo:write"]]
          # Needed for RS256 + a public JWKS endpoint (Istio validates via remote JWKS, not
          # a shared secret) -- unlike Kiali's blueprint, which doesn't need this since Kiali
          # validates its own OIDC token in-process.
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      - model: authentik_core.application
        id: tempo-app
        state: present
        identifiers:
          slug: tempo
        attrs:
          name: Tempo
          slug: tempo
          provider: !KeyOf tempo-m2m-provider
