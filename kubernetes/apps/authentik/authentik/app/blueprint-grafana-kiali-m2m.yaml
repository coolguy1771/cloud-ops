---
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-grafana-kiali-m2m
data:
  grafana-kiali-m2m.yaml: |
    version: 1
    metadata:
      name: Grafana Kiali M2M (client credentials)
    entries:
      - model: authentik_providers_oauth2.oauth2provider
        id: grafana-kiali-m2m-provider
        state: present
        identifiers:
          name: grafana-kiali-m2m
        attrs:
          name: grafana-kiali-m2m
          client_type: confidential
          redirect_uris: []
          grant_types:
            - client_credentials
          issuer_mode: per_provider
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      - model: authentik_core.application
        id: grafana-kiali-m2m-app
        state: present
        identifiers:
          slug: grafana-kiali-m2m
        attrs:
          name: Grafana Kiali M2M
          slug: grafana-kiali-m2m
          provider: !KeyOf grafana-kiali-m2m-provider
