---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mimir
spec:
  chartRef:
    kind: OCIRepository
    name: mimir
  interval: 1h
  timeout: 10m
  values:
    fullnameOverride: mimir
    # Mimir 3.2.0's binary has no write/read/backend meta-targets (that's a
    # mimir-distributed chart concept, not something the "all" single-binary
    # build understands) - "-target=all,alertmanager" is the only valid
    # single-process target. Redundancy instead comes from running 3 full
    # replicas as peers in the same ring (StatefulSet + per-pod PVC so they
    # don't fight over one shared volume), each replicated at RF 3.
    controllers:
      mimir:
        type: statefulset
        replicas: 3
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/grafana/mimir
              tag: 3.2.0
            args:
              - -target=all,alertmanager
              - -config.file=/etc/mimir/mimir.yaml
              - -config.expand-env=true
            envFrom:
              - secretRef:
                  name: mimir-s3-credentials
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ready
                    port: 8080
                  initialDelaySeconds: 45
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ready
                    port: 8080
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop: ["ALL"]
            resources:
              # ~4 CPU / ~7Gi workers: 2 CPU requests left no room for RF=3
              # once other packs filled remaining nodes.
              requests:
                cpu: "1500m"
                memory: 2Gi
              limits:
                cpu: "4"
                memory: 6Gi
        statefulset:
          serviceName: mimir-headless
          volumeClaimTemplates:
            - name: data
              size: 80Gi
              storageClass: hcloud-volumes
              accessMode: ReadWriteOnce
              globalMounts:
                - path: /data
    service:
      app:
        primary: true
        ports:
          http:
            port: 8080
          grpc:
            port: 9095
            protocol: TCP
      headless:
        clusterIP: None
        ports:
          memberlist:
            port: 7946
            protocol: TCP
    configMaps:
      config:
        data:
          mimir.yaml: |
            multitenancy_enabled: true

            server:
              http_listen_port: 8080
              grpc_server_max_recv_msg_size: 104857600
              grpc_server_max_send_msg_size: 104857600

            common:
              storage:
                backend: s3
                s3:
                  endpoint: "${S3_ENDPOINT}"
                  access_key_id: "${S3_ACCESS_KEY_ID}"
                  secret_access_key: "${S3_SECRET_ACCESS_KEY}"
                  bucket_name: "${MIMIR_BUCKET}"
                  insecure: false

            blocks_storage:
              backend: s3
              storage_prefix: blocks
              s3:
                endpoint: "${S3_ENDPOINT}"
                access_key_id: "${S3_ACCESS_KEY_ID}"
                secret_access_key: "${S3_SECRET_ACCESS_KEY}"
                bucket_name: "${MIMIR_BUCKET}"
                insecure: false
              tsdb:
                dir: /data/tsdb
              bucket_store:
                sync_dir: /data/tsdb-sync

            ruler_storage:
              backend: s3
              storage_prefix: ruler
              s3:
                endpoint: "${S3_ENDPOINT}"
                access_key_id: "${S3_ACCESS_KEY_ID}"
                secret_access_key: "${S3_SECRET_ACCESS_KEY}"
                bucket_name: "${MIMIR_BUCKET}"
                insecure: false

            alertmanager_storage:
              backend: s3
              storage_prefix: alertmanager
              s3:
                endpoint: "${S3_ENDPOINT}"
                access_key_id: "${S3_ACCESS_KEY_ID}"
                secret_access_key: "${S3_SECRET_ACCESS_KEY}"
                bucket_name: "${MIMIR_BUCKET}"
                insecure: false

            alertmanager:
              data_dir: /data/alertmanager
              enable_api: true
              external_url: https://mimir.cloud.witl.xyz/alertmanager
              sharding_ring:
                kvstore:
                  store: memberlist
                replication_factor: 3

            compactor:
              data_dir: /data/compactor
              compaction_interval: 30m
              deletion_delay: 2h
              sharding_ring:
                kvstore:
                  store: memberlist

            store_gateway:
              sharding_ring:
                kvstore:
                  store: memberlist
                replication_factor: 3

            memberlist:
              join_members:
                - dns+mimir-headless.mimir-system.svc.cluster.local:7946

            distributor:
              ring:
                kvstore:
                  store: memberlist
              ha_tracker:
                enable_ha_tracker: true
                kvstore:
                  store: memberlist
            ingester:
              ring:
                kvstore:
                  store: memberlist
                replication_factor: 3

            limits:
              max_global_series_per_user: 1000000
              max_global_series_per_metric: 100000
              max_label_names_per_series: 50
              ingestion_rate: 100000
              ingestion_burst_size: 200000
              out_of_order_time_window: 5m
              accept_ha_samples: true
              ruler_max_rules_per_rule_group: 50
              ruler_max_rule_groups_per_tenant: 200

            ruler:
              enable_api: true
              rule_path: /data/ruler
              alertmanager_url: http://127.0.0.1:8080/alertmanager
              ring:
                kvstore:
                  store: memberlist
    persistence:
      config-file:
        type: configMap
        identifier: config
        globalMounts:
          - path: /etc/mimir
            readOnly: true
