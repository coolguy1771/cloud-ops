---
# Kiali runs in istio-system (not ambient). Mimir is ambient + mesh STRICT mTLS,
# which resets plain TCP from Kiali. PERMISSIVE accepts both mTLS and plaintext.
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: mimir
  namespace: mimir-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: mimir
  mtls:
    mode: PERMISSIVE
