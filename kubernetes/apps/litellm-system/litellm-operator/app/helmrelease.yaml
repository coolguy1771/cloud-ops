---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: litellm-operator
spec:
  chartRef:
    kind: OCIRepository
    name: litellm-operator
  interval: 1h
  values:
    replicaCount: 1
    controller:
      logLevel: info
    webhook:
      enabled: true
    podAnnotations:
      reloader.stakater.com/auto: "true"
