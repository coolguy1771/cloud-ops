---
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kuma-control-plane
spec:
  interval: 30m
  chart:
    spec:
      chart: kuma
      version: "2.14.3"
      sourceRef:
        kind: HelmRepository
        name: kuma-control-plane
  install:
    createNamespace: true
  upgrade:
    cleanupOnFail: true
  values:
    controlPlane:
      defaults:
        skipMeshCreation: true
