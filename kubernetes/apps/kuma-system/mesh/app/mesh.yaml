---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kuma.io/mesh_v1alpha1.json
apiVersion: kuma.io/v1alpha1
kind: Mesh
metadata:
  name: default
spec:
  mtls:
    enabledBackend: ca
    backends:
      - name: ca
        type: builtin
        # cert is auto-generated by Kuma CP when using builtin CA
  logging:
    defaultBackend: observability-backend
    backends:
      - name: observability-backend
        type: file
        conf:
          path: /dev/stdout
          maxSize: "100M"
          maxAge: "30"
          compress: true
  trafficPermissions:
    default: deny-all
