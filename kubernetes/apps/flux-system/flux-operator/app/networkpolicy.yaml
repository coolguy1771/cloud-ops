---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
# Replaces the flux-operator chart's own NetworkPolicy (web.networkPolicy.create: false
# below) with one Cilium-native policy. Port 15008 must stay allowed alongside the real
# app ports: in ambient mesh, pod-to-pod ingress arrives via ztunnel's HBONE tunnel on
# 15008 before being decapsulated, and Cilium enforces policy against that outer tunnel
# port regardless of NetworkPolicy vs CiliumNetworkPolicy — there's no Cilium/Istio
# integration that makes L4 policy HBONE-aware, per Cilium's own docs:
# https://docs.cilium.io/en/stable/network/servicemesh/istio/
# https://ambientmesh.io/docs/security/configure-networkpolicies/
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: flux-operator-web
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: flux-operator
      app.kubernetes.io/name: flux-operator
  ingress:
    - fromEndpoints:
        - {}
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
            - port: "9080"
              protocol: TCP
            - port: "15008"
              protocol: TCP
