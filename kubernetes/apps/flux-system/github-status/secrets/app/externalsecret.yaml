---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-status-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: github-status-app
    template:
      data:
        GITHUB_APP_ID: '{{ .ACTIONS_RUNNER_APP_ID }}'
        GITHUB_INSTALLATION_ID: '{{ .ACTIONS_RUNNER_INSTALLATION_ID }}'
        privateKey: '{{ .ACTIONS_RUNNER_PRIVATE_KEY }}'
  dataFrom:
    - extract:
        key: actions-runner
