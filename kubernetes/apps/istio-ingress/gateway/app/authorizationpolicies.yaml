---
# Per-host ALLOW policies on the shared Gateway.
# Istio 1.30 cannot targetRefs HTTPRoute yet (istio/istio#59328); host/path rules
# mirror HTTPRoute scope until that lands — then move each policy beside its route.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: gateway-allow-ui
  namespace: istio-ingress
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: istio
  action: ALLOW
  rules:
    - to:
        - operation:
            hosts: ["kiali.cloud.witl.xyz"]
            paths: ["/", "/*"]
    - to:
        - operation:
            hosts: ["grafana.cloud.witl.xyz"]
            paths: ["/", "/*"]
    - to:
        - operation:
            hosts: ["auth.cloud.witl.xyz"]
            paths: ["/", "/*"]
    - to:
        - operation:
            hosts: ["flux-operator.cloud.witl.xyz"]
            paths: ["/", "/*"]
    - to:
        - operation:
            hosts: ["flux-webhook.cloud.witl.xyz"]
            paths: ["/hook/*"]
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: gateway-allow-tempo
  namespace: istio-ingress
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: istio
  action: ALLOW
  rules:
    - to:
        - operation:
            hosts: ["tempo.cloud.witl.xyz"]
            paths: ["/ready*"]
    - to:
        - operation:
            hosts: ["tempo.cloud.witl.xyz"]
            paths: ["/api*"]
      when:
        - key: request.auth.claims[iss]
          values: ["https://auth.cloud.witl.xyz/application/o/grafana/"]
    - to:
        - operation:
            hosts: ["tempo.cloud.witl.xyz"]
            paths: ["/api*"]
      when:
        - key: request.auth.claims[scope]
          values: ["tempo:read"]
    - to:
        - operation:
            hosts: ["tempo.cloud.witl.xyz"]
            paths: ["/v1/traces*"]
      when:
        - key: request.auth.claims[scope]
          values: ["tempo:write"]
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: gateway-allow-loki
  namespace: istio-ingress
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: istio
  action: ALLOW
  rules:
    - to:
        - operation:
            hosts: ["loki.cloud.witl.xyz"]
            paths: ["/ready*"]
    - to:
        - operation:
            hosts: ["loki.cloud.witl.xyz"]
            paths:
              - "/api/prom/push*"
              - "/loki/api/v1/push*"
              - "/otlp/v1/logs*"
              - "/ui*"
              - "/loki/api/v1/delete*"
      when:
        - key: request.auth.claims[scope]
          values: ["loki:write"]
    - to:
        - operation:
            hosts: ["loki.cloud.witl.xyz"]
            paths:
              - "/api/prom/query*"
              - "/api/prom/label*"
              - "/api/prom/series*"
              - "/api/prom/tail*"
              - "/api/prom/rules*"
              - "/api/prom/api*"
              - "/loki/api/v1/query*"
              - "/loki/api/v1/tail*"
              - "/loki/api/v1/label*"
              - "/loki/api/v1/series*"
              - "/loki/api/v1/index*"
              - "/loki/api/v1/format*"
              - "/loki/api/v1/detected*"
              - "/loki/api/v1/patterns*"
              - "/loki/api/v1/rules*"
              - "/prometheus/api*"
      when:
        - key: request.auth.claims[iss]
          values: ["https://auth.cloud.witl.xyz/application/o/grafana/"]
        - key: request.auth.claims[scope]
          values: ["tenant"]
    - to:
        - operation:
            hosts: ["loki.cloud.witl.xyz"]
            paths:
              - "/api/prom/query*"
              - "/api/prom/label*"
              - "/api/prom/series*"
              - "/api/prom/tail*"
              - "/api/prom/rules*"
              - "/api/prom/api*"
              - "/loki/api/v1/query*"
              - "/loki/api/v1/tail*"
              - "/loki/api/v1/label*"
              - "/loki/api/v1/series*"
              - "/loki/api/v1/index*"
              - "/loki/api/v1/format*"
              - "/loki/api/v1/detected*"
              - "/loki/api/v1/patterns*"
              - "/loki/api/v1/rules*"
              - "/prometheus/api*"
      when:
        - key: request.auth.claims[scope]
          values: ["loki:read"]
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: gateway-allow-mimir
  namespace: istio-ingress
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: istio
  action: ALLOW
  rules:
    - to:
        - operation:
            hosts: ["mimir.cloud.witl.xyz"]
            paths:
              - "/api/v1/push*"
              - "/otlp/v1/metrics*"
              - "/distributor*"
              - "/api/v1/upload*"
      when:
        - key: request.auth.claims[scope]
          values: ["mimir:write"]
    - to:
        - operation:
            hosts: ["mimir.cloud.witl.xyz"]
            paths:
              - "/prometheus*"
              - "/ruler*"
              - "/alertmanager*"
              - "/multitenant_alertmanager*"
      when:
        - key: request.auth.claims[iss]
          values: ["https://auth.cloud.witl.xyz/application/o/grafana/"]
        - key: request.auth.claims[scope]
          values: ["tenant"]
    - to:
        - operation:
            hosts: ["mimir.cloud.witl.xyz"]
            paths:
              - "/prometheus*"
              - "/ruler*"
              - "/alertmanager*"
              - "/multitenant_alertmanager*"
      when:
        - key: request.auth.claims[scope]
          values: ["mimir:read"]
---
# Hubble UI: OIDC session via authservice (CUSTOM). Group gate is Authentik's
# application policy (cloud-ops-admin). Do not require request.auth.claims here:
# jwt_authn runs before ext_authz header injection, so claims from the
# Authservice-injected ID token are not available to ALLOW on the same request.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: gateway-hubble-authservice
  namespace: istio-ingress
spec:
  selector:
    matchLabels:
      service.istio.io/canonical-name: istio-istio
  action: CUSTOM
  provider:
    name: authservice-grpc
  rules:
    - to:
        - operation:
            hosts: ["hubble.cloud.witl.xyz"]
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: gateway-allow-hubble
  namespace: istio-ingress
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: istio
  action: ALLOW
  rules:
    - to:
        - operation:
            hosts: ["hubble.cloud.witl.xyz"]
            paths: ["/", "/*"]
