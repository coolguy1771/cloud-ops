---
# Per-host ALLOW policies on the shared Gateway.
# Istio 1.30 cannot targetRefs HTTPRoute yet (istio/istio#59328); host/path rules
# mirror HTTPRoute scope until that lands — then move each policy beside its route.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: gateway-allow-ui
  namespace: istio-ingress
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: istio
  action: ALLOW
  rules:
    - to:
        - operation:
            hosts: ["kiali.cloud.witl.xyz"]
            paths: ["/", "/*"]
    - to:
        - operation:
            hosts: ["grafana.cloud.witl.xyz"]
            paths: ["/", "/*"]
    - to:
        - operation:
            hosts: ["auth.cloud.witl.xyz"]
            paths: ["/", "/*"]
    - to:
        - operation:
            hosts: ["flux-operator.cloud.witl.xyz"]
            paths: ["/", "/*"]
    - to:
        - operation:
            hosts: ["flux-webhook.cloud.witl.xyz"]
            paths: ["/hook/*"]
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: gateway-allow-tempo
  namespace: istio-ingress
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: istio
  action: ALLOW
  rules:
    - to:
        - operation:
            hosts: ["tempo.cloud.witl.xyz"]
            paths: ["/ready*"]
    - to:
        - operation:
            hosts: ["tempo.cloud.witl.xyz"]
            paths: ["/api*"]
      when:
        - key: request.auth.claims[iss]
          values: ["https://auth.cloud.witl.xyz/application/o/grafana/"]
    - to:
        - operation:
            hosts: ["tempo.cloud.witl.xyz"]
            paths: ["/api*"]
      when:
        - key: request.auth.claims[scope]
          values: ["tempo:read"]
    - to:
        - operation:
            hosts: ["tempo.cloud.witl.xyz"]
            paths: ["/v1/traces*"]
      when:
        - key: request.auth.claims[scope]
          values: ["tempo:write"]
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: gateway-allow-loki
  namespace: istio-ingress
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: istio
  action: ALLOW
  rules:
    - to:
        - operation:
            hosts: ["loki.cloud.witl.xyz"]
            paths: ["/ready*"]
    - to:
        - operation:
            hosts: ["loki.cloud.witl.xyz"]
            paths:
              - "/api/prom/push*"
              - "/loki/api/v1/push*"
              - "/otlp/v1/logs*"
              - "/ui*"
              - "/loki/api/v1/delete*"
      when:
        - key: request.auth.claims[scope]
          values: ["loki:write"]
    - to:
        - operation:
            hosts: ["loki.cloud.witl.xyz"]
            paths:
              - "/api/prom/query*"
              - "/api/prom/label*"
              - "/api/prom/series*"
              - "/api/prom/tail*"
              - "/api/prom/rules*"
              - "/api/prom/api*"
              - "/loki/api/v1/query*"
              - "/loki/api/v1/tail*"
              - "/loki/api/v1/label*"
              - "/loki/api/v1/series*"
              - "/loki/api/v1/index*"
              - "/loki/api/v1/format*"
              - "/loki/api/v1/detected*"
              - "/loki/api/v1/patterns*"
              - "/loki/api/v1/rules*"
              - "/prometheus/api*"
      when:
        - key: request.auth.claims[iss]
          values: ["https://auth.cloud.witl.xyz/application/o/grafana/"]
        - key: request.auth.claims[scope]
          values: ["tenant"]
    - to:
        - operation:
            hosts: ["loki.cloud.witl.xyz"]
            paths:
              - "/api/prom/query*"
              - "/api/prom/label*"
              - "/api/prom/series*"
              - "/api/prom/tail*"
              - "/api/prom/rules*"
              - "/api/prom/api*"
              - "/loki/api/v1/query*"
              - "/loki/api/v1/tail*"
              - "/loki/api/v1/label*"
              - "/loki/api/v1/series*"
              - "/loki/api/v1/index*"
              - "/loki/api/v1/format*"
              - "/loki/api/v1/detected*"
              - "/loki/api/v1/patterns*"
              - "/loki/api/v1/rules*"
              - "/prometheus/api*"
      when:
        - key: request.auth.claims[scope]
          values: ["loki:read"]
---
# Per-host Mimir ALLOW policy on the shared Gateway.
# Only non-destructive endpoints are allowed — shutdown and delete operations
# (ingester/shutdown, ingester/prepare-*, store-gateway/prepare-shutdown,
# ruler/delete_tenant_config, multitenant_alertmanager/delete_tenant_config,
# compactor/delete_tenant, DELETE on /prometheus/config/v1/rules/* and
# /api/v1/alerts) are intentionally not routed or blocked.
# https://grafana.com/docs/mimir/latest/references/http-api/
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: gateway-allow-mimir
  namespace: istio-ingress
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: istio
  action: ALLOW
  rules:
    # Readiness probe — no auth required (health checks, load balancer).
    - to:
        - operation:
            hosts: ["mimir.cloud.witl.xyz"]
            paths: ["/ready*"]
    # Write/ingest endpoints (distributor).
    - to:
        - operation:
            hosts: ["mimir.cloud.witl.xyz"]
            paths:
              - "/api/v1/push*"
              - "/otlp/v1/metrics*"
              - "/distributor/*"
              - "/api/v1/upload/*"
      when:
        - key: request.auth.claims[scope]
          values: ["mimir:write"]
    # Grafana (OIDC users, tenant scope): query + operational endpoints. Destructive
    # sub-paths (shutdown, prepare-*, delete_tenant*, flush) and pprof/config are
    # excluded by listing only safe sub-paths. Rule/Alertmanager CRUD is below.
    - to:
        - operation:
            hosts: ["mimir.cloud.witl.xyz"]
            methods: ["GET", "POST"]
            paths:
              # Query-frontend + ruler read (Prometheus API under /prometheus)
              - "/prometheus/*"
              - "/prometheus"
              # Ruler read-only (ring, rule_groups)
              - "/ruler/ring"
              - "/ruler/rule_groups"
              # Alertmanager UI + buildinfo
              - "/alertmanager/*"
              - "/alertmanager"
              # Alertmanager operational (status, configs, ring)
              - "/multitenant_alertmanager/status"
              - "/multitenant_alertmanager/configs"
              - "/multitenant_alertmanager/ring"
              # Alertmanager configuration (GET/POST; DELETE via separate rule below)
              - "/api/v1/alerts"
              # Ingester (ring, tenants, tsdb — no flush/shutdown/prepare-*)
              - "/ingester/ring"
              - "/ingester/tenants"
              - "/ingester/tsdb/*"
              - "/ingester/tsdb_metrics"
              # Store-gateway (ring, tenants, tenant blocks — no prepare-shutdown)
              - "/store-gateway/ring"
              - "/store-gateway/tenants"
              - "/store-gateway/tenant/*"
              # Compactor (ring, tenants, planned_jobs, delete_tenant_status — no delete_tenant)
              - "/compactor/ring"
              - "/compactor/tenants"
              - "/compactor/tenant/*"
              - "/compactor/delete_tenant_status"
              # Query-scheduler ring status
              - "/query-scheduler/ring"
              # Overrides-exporter ring status
              - "/overrides-exporter/ring"
              # Tenant limits (all services)
              - "/api/v1/user_limits"
              # Tenant ingestion stats (querier)
              - "/api/v1/user_stats"
              # Services' status (all services)
              - "/services"
              # Metrics (all services)
              - "/metrics"
              # Memberlist cluster (all services)
              - "/memberlist"
              # Status endpoints (config, flags, buildinfo)
              - "/api/v1/status/*"
      when:
        - key: request.auth.claims[iss]
          values: ["https://auth.cloud.witl.xyz/application/o/grafana/"]
        - key: request.auth.claims[scope]
          values: ["tenant"]
    # Ruler rules CRUD (GET/POST/DELETE on /prometheus/config/v1/rules/*).
    - to:
        - operation:
            hosts: ["mimir.cloud.witl.xyz"]
            methods: ["GET", "POST", "DELETE"]
            paths:
              - "/prometheus/config/v1/rules/*"
      when:
        - key: request.auth.claims[iss]
          values: ["https://auth.cloud.witl.xyz/application/o/grafana/"]
        - key: request.auth.claims[scope]
          values: ["tenant"]
    # Alertmanager config deletion (DELETE /api/v1/alerts).
    - to:
        - operation:
            hosts: ["mimir.cloud.witl.xyz"]
            methods: ["DELETE"]
            paths:
              - "/api/v1/alerts"
      when:
        - key: request.auth.claims[iss]
          values: ["https://auth.cloud.witl.xyz/application/o/grafana/"]
        - key: request.auth.claims[scope]
          values: ["tenant"]
    # mimir:read is strictly read-only: GET on query + status pages, POST only on the
    # Prometheus query API (query/query_range/series/labels accept form POSTs).
    # Excluded: /debug/* (pprof), /config + /runtime_config, /metrics, /ingester/flush,
    # and every ruler/alertmanager mutation (those need mimir:admin below).
    - to:
        - operation:
            hosts: ["mimir.cloud.witl.xyz"]
            methods: ["GET"]
            paths:
              - "/prometheus/api/v1/*"
              - "/prometheus/config/v1/rules"
              - "/prometheus/config/v1/rules/*"
              - "/api/v1/alerts"
              - "/ruler/ring"
              - "/ruler/rule_groups"
              - "/alertmanager/*"
              - "/alertmanager"
              - "/multitenant_alertmanager/status"
              - "/multitenant_alertmanager/configs"
              - "/multitenant_alertmanager/ring"
              - "/ingester/ring"
              - "/ingester/tenants"
              - "/ingester/tsdb/*"
              - "/ingester/tsdb_metrics"
              - "/store-gateway/ring"
              - "/store-gateway/tenants"
              - "/store-gateway/tenant/*"
              - "/compactor/ring"
              - "/compactor/tenants"
              - "/compactor/tenant/*"
              - "/compactor/delete_tenant_status"
              - "/query-scheduler/ring"
              - "/overrides-exporter/ring"
              - "/api/v1/user_limits"
              - "/api/v1/user_stats"
              - "/services"
              - "/memberlist"
              - "/api/v1/status/*"
      when:
        - key: request.auth.claims[scope]
          values: ["mimir:read"]
    - to:
        - operation:
            hosts: ["mimir.cloud.witl.xyz"]
            methods: ["POST"]
            paths:
              - "/prometheus/api/v1/*"
      when:
        - key: request.auth.claims[scope]
          values: ["mimir:read"]
    # mimir:admin: ruler rules + Alertmanager config CRUD (mimirtool-load-*.sh).
    - to:
        - operation:
            hosts: ["mimir.cloud.witl.xyz"]
            methods: ["GET", "POST", "DELETE"]
            paths:
              - "/prometheus/config/v1/rules"
              - "/prometheus/config/v1/rules/*"
              - "/api/v1/alerts"
      when:
        - key: request.auth.claims[scope]
          values: ["mimir:admin"]
---

# Hubble UI: OIDC session via authservice (CUSTOM). Group gate is Authentik's
# application policy (cloud-ops-admin). Do not require request.auth.claims here:
# jwt_authn runs before ext_authz header injection, so claims from the
# Authservice-injected ID token are not available to ALLOW on the same request.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: gateway-hubble-authservice
  namespace: istio-ingress
spec:
  selector:
    matchLabels:
      service.istio.io/canonical-name: istio-istio
  action: CUSTOM
  provider:
    name: authservice-grpc
  rules:
    - to:
        - operation:
            hosts: ["hubble.cloud.witl.xyz"]
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: gateway-allow-hubble
  namespace: istio-ingress
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: istio
  action: ALLOW
  rules:
    - to:
        - operation:
            hosts: ["hubble.cloud.witl.xyz"]
            paths: ["/", "/*"]
