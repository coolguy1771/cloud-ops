---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/networking.istio.io/envoyfilter_v1alpha3.json
# Gateway RequestAuthentication validates any Authorization Bearer as JWT.
# Authentik API tokens are opaque, so API calls to auth.cloud.witl.xyz get
# "Jwt is not in the form of Header.Payload.Signature". Disable jwt_authn on
# that vhost only; other hosts keep JWT validation for Mimir/Loki/Tempo/Hubble.
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: gateway-skip-jwt-authentik
  namespace: istio-ingress
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: istio
  configPatches:
    - applyTo: VIRTUAL_HOST
      match:
        context: GATEWAY
        routeConfiguration:
          vhost:
            name: auth.cloud.witl.xyz:443
      patch:
        operation: MERGE
        value:
          typed_per_filter_config:
            envoy.filters.http.jwt_authn:
              "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.PerRouteConfig
              disabled: true
