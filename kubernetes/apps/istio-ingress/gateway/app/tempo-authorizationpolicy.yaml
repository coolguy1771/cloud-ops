---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/security.istio.io/authorizationpolicy_v1.json
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: tempo-jwt-required
  namespace: istio-ingress
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: istio
  action: ALLOW
  rules:
    # Shared istio Gateway also serves Kiali (https listener). Without an explicit
    # ALLOW, ambient mode rejects all other hostnames on this gateway workload.
    # Include / so https://kiali.cloud.witl.xyz/ (HTTPRoute redirect to /kiali) is allowed.
    - to:
        - operation:
            hosts: ["kiali.cloud.witl.xyz"]
            paths: ["/", "/*"]
    - to:
        - operation:
            hosts: ["tempo.cloud.witl.xyz"]
            paths: ["/ready*"]
    - to:
        - operation:
            hosts: ["tempo.cloud.witl.xyz"]
            paths: ["/api*"]
      when:
        - key: request.auth.claims[iss]
          values: ["https://auth.cloud.witl.xyz/application/o/grafana/"]
    - to:
        - operation:
            hosts: ["tempo.cloud.witl.xyz"]
            paths: ["/api*"]
      when:
        - key: request.auth.claims[scope]
          values: ["tempo:read"]
    - to:
        - operation:
            hosts: ["tempo.cloud.witl.xyz"]
            paths: ["/v1/traces*"]
      when:
        - key: request.auth.claims[scope]
          values: ["tempo:write"]
