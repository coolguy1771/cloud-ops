---
# yaml-language-server: $schema=https://json.schemastore.org/kubernetes-configmap
# Strategic-merge-patched onto the auto-provisioned gateway Deployment via
# spec.infrastructure.parametersRef in gateway.yaml. Spreads replicas one per
# Hetzner region so a single-AZ outage doesn't take down all external traffic.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-options
data:
  deployment: |
    spec:
      template:
        spec:
          affinity:
            podAntiAffinity:
              # preferred, not required: a hard region constraint blocks the surge pod
              # during a rolling update once all 3 regions already hold a pod (learned
              # live — the rollout stalls Pending with "didn't match pod anti-affinity
              # rules" until the constraint is softened).
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    labelSelector:
                      matchLabels:
                        gateway.networking.k8s.io/gateway-name: istio
                    topologyKey: topology.kubernetes.io/region
                - weight: 50
                  podAffinityTerm:
                    labelSelector:
                      matchLabels:
                        gateway.networking.k8s.io/gateway-name: istio
                    topologyKey: kubernetes.io/hostname
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gateway-istio
spec:
  minAvailable: 1
  selector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: istio
