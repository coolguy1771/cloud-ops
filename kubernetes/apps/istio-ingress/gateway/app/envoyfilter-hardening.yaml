---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/networking.istio.io/envoyfilter_v1alpha3.json
# Edge hardening + real-IP / forwarded headers for Cloudflare → Istio Gateway → apps.
# Path: client → Cloudflare (CF-Connecting-IP + XFF) → Hetzner L4 LB → Envoy.
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: gateway-hardening
  namespace: istio-ingress
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: istio
  configPatches:
    - applyTo: NETWORK_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
      patch:
        operation: INSERT_BEFORE
        value:
          name: envoy.filters.network.connection_limit
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.network.connection_limit.v3.ConnectionLimit
            stat_prefix: gateway_connection_limit
            max_connections: 10000
            delay: 5s
    - applyTo: NETWORK_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
      patch:
        operation: MERGE
        value:
          name: envoy.filters.network.http_connection_manager
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
            # Trust one proxy hop (Cloudflare). Hetzner LB is L4 and does not append XFF.
            use_remote_address: true
            xff_num_trusted_hops: 1
            skip_xff_append: false
            append_x_forwarded_port: true
            generate_request_id: true
            preserve_external_request_id: true
            common_http_protocol_options:
              idle_timeout: 300s
              headers_with_underscores_action: REJECT_REQUEST
            http2_protocol_options:
              max_concurrent_streams: 100
              initial_stream_window_size: 65536
              initial_connection_window_size: 1048576
    # Prefer Cloudflare's CF-Connecting-IP for apps that read X-Real-IP / X-Forwarded-For.
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
              subFilter:
                name: envoy.filters.http.router
      patch:
        operation: INSERT_BEFORE
        value:
          name: envoy.lua.real_ip
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
            defaultSourceCode:
              inlineString: |
                function envoy_on_request(handle)
                  local cf = handle:headers():get("cf-connecting-ip")
                  local xff = handle:headers():get("x-forwarded-for")
                  local ip = cf
                  if ip == nil or ip == "" then
                    if xff ~= nil and xff ~= "" then
                      ip = string.match(xff, "([^,%s]+)")
                    end
                  end
                  if ip ~= nil and ip ~= "" then
                    handle:headers():replace("x-real-ip", ip)
                    -- Ensure the leftmost XFF entry is the client when CF header is present.
                    if cf ~= nil and cf ~= "" then
                      handle:headers():replace("x-forwarded-for", cf)
                    end
                  end
                  if handle:headers():get("x-forwarded-proto") == nil then
                    handle:headers():add("x-forwarded-proto", "https")
                  end
                  if handle:headers():get("x-forwarded-host") == nil then
                    local host = handle:headers():get(":authority")
                    if host ~= nil then
                      handle:headers():add("x-forwarded-host", host)
                    end
                  end
                end
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
              subFilter:
                name: envoy.filters.http.router
      patch:
        operation: INSERT_BEFORE
        value:
          name: envoy.filters.http.local_ratelimit
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
            stat_prefix: gateway_http_local_rate_limiter
            token_bucket:
              max_tokens: 2000
              tokens_per_fill: 200
              fill_interval: 1s
            filter_enabled:
              runtime_key: gateway_local_rate_limit_enabled
              default_value:
                numerator: 100
                denominator: HUNDRED
            filter_enforced:
              runtime_key: gateway_local_rate_limit_enforced
              default_value:
                numerator: 100
                denominator: HUNDRED
            response_headers_to_add:
              - append_action: OVERWRITE_IF_EXISTS_OR_ADD
                header:
                  key: x-local-rate-limit
                  value: "true"
