---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/gateway_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: istio
spec:
  gatewayClassName: istio
  infrastructure:
    annotations:
      load-balancer.hetzner.cloud/network-zone: eu-central
  listeners:
    - name: https-kiali
      protocol: HTTPS
      port: 443
      hostname: "kiali.cloud.witl.xyz"
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: cloud-witl-xyz-tls
    - name: https-tempo
      protocol: HTTPS
      port: 443
      hostname: "tempo.cloud.witl.xyz"
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: cloud-witl-xyz-tls
    - name: https-loki
      protocol: HTTPS
      port: 443
      hostname: "loki.cloud.witl.xyz"
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: cloud-witl-xyz-tls
    - name: https-grafana
      protocol: HTTPS
      port: 443
      hostname: "grafana.cloud.witl.xyz"
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: cloud-witl-xyz-tls
    - name: https-mimir
      protocol: HTTPS
      port: 443
      hostname: "mimir.cloud.witl.xyz"
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: mimir-system
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: cloud-witl-xyz-tls
    - name: https-auth
      protocol: HTTPS
      port: 443
      hostname: "auth.cloud.witl.xyz"
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: authentik
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: cloud-witl-xyz-tls
    - name: https-flux-operator
      protocol: HTTPS
      port: 443
      hostname: "flux-operator.cloud.witl.xyz"
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: flux-system
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: cloud-witl-xyz-tls
    - name: https-flux-webhook
      protocol: HTTPS
      port: 443
      hostname: "flux-webhook.cloud.witl.xyz"
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: flux-system
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: cloud-witl-xyz-tls
