---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/gateway_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: istio
  annotations:
    # Prefer publishing A/AAAA to the Hetzner LB (Cloudflare proxied via extraArgs).
    external-dns.alpha.kubernetes.io/hostname: "*.cloud.witl.xyz"
spec:
  gatewayClassName: istio
  infrastructure:
    annotations:
      load-balancer.hetzner.cloud/network-zone: eu-central
    parametersRef:
      group: ""
      kind: ConfigMap
      name: gateway-options
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.cloud.witl.xyz"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: cloud-witl-xyz-tls
