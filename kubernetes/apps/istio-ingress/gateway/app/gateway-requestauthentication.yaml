---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/security.istio.io/requestauthentication_v1.json
# JWT validation on the shared Gateway. Opaque Authentik API tokens on
# auth.cloud.witl.xyz are excluded via envoyfilter-skip-jwt-authentik.yaml.
apiVersion: security.istio.io/v1
kind: RequestAuthentication
metadata:
  name: gateway-jwt
  namespace: istio-ingress
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: istio
  jwtRules:
    - issuer: "https://auth.cloud.witl.xyz/application/o/grafana/"
      jwksUri: "https://auth.cloud.witl.xyz/application/o/grafana/jwks/"
      spaceDelimitedClaims:
        - scope
      outputClaimToHeaders:
        - header: X-Scope-OrgID
          claim: tenant_id
    - issuer: "https://auth.cloud.witl.xyz/application/o/observability-m2m/"
      jwksUri: "https://auth.cloud.witl.xyz/application/o/observability-m2m/jwks/"
      spaceDelimitedClaims:
        - scope
      outputClaimToHeaders:
        - header: X-Scope-OrgID
          claim: tenant_id
    - issuer: "https://auth.cloud.witl.xyz/application/o/hubble/"
      jwksUri: "https://auth.cloud.witl.xyz/application/o/hubble/jwks/"
      # Optional: validate a client-supplied Hubble JWT if present. Browser
      # sessions authenticate via authservice CUSTOM (cookies); injected ID
      # tokens are not re-processed by jwt_authn on the same request.
      forwardOriginalToken: true
