---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: istio-ingress-gateway
  namespace: istio-ingress
  labels:
    app.kubernetes.io/name: istio-ingress-gateway
spec:
  selector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: istio
  namespaceSelector:
    matchNames:
      - istio-ingress
  podMetricsEndpoints:
    # Istio agent /stats/prometheus already merges agent + Envoy; do not also
    # scrape http-envoy-prom or Envoy series are duplicated.
    - port: metrics
      path: /stats/prometheus
      interval: 30s
