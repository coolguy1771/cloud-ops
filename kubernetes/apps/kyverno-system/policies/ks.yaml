---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kyverno-policies
spec:
  dependsOn:
    - name: kyverno
  interval: 1h
  path: ./kubernetes/apps/kyverno-system/policies/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: kyverno-system
  wait: true
