---
# Kuma 2.14.x Helm values for production-ready multi-zone control plane
installation:
  namespace: kuma-system

global:
  dnsServers:
    - "8.8.8.8"
    - "1.1.1.1"
  mtls:
    enabled: true
    caCertRotatorInterval: 720h
  logging:
    level: info
  metrics:
    prometheus:
      enabled: true

controlPlane:
  replicas: 3
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 60

# Envoy sidecar defaults
envoyAdminPort: 9901
